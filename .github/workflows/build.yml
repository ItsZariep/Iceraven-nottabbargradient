name: Build IceRaven Dark Theme (Auto-Release)

on:
  schedule:
    - cron: '00 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest release from Upstream
        id: get_upstream_release
        uses: cardinalby/git-get-release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          repo: fork-maintainers/iceraven-browser
          latest: true

      - name: Get latest release from this repo
        id: this_repo_release
        uses: cardinalby/git-get-release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          latest: true
          doNotFailIfNotFound: true

      - name: Check version difference
        id: version_check
        run: |
          UPSTREAM_TAG="${{ steps.get_upstream_release.outputs.tag_name }}"
          THIS_TAG="${{ steps.this_repo_release.outputs.tag_name }}"

          echo "Upstream version: $UPSTREAM_TAG"
          echo "Current release version: $THIS_TAG"

          if [ "$UPSTREAM_TAG" != "$THIS_TAG" ]; then
            echo "NEW_VERSION_AVAILABLE=true" >> $GITHUB_OUTPUT
            echo "UPSTREAM_VERSION=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          else
            echo "NEW_VERSION_AVAILABLE=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract Download URL
        if: steps.version_check.outputs.NEW_VERSION_AVAILABLE == 'true'
        id: extract_url
        env:
          ASSETS: ${{ steps.get_upstream_release.outputs.assets }}
        run: |
          DOWNLOAD_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | contains("arm64")) | .browser_download_url')
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      - name: Install Dependencies
        if: steps.version_check.outputs.NEW_VERSION_AVAILABLE == 'true'
        run: |
          sudo apt update
          sudo apt install -y wget zipalign apksigner openjdk-17-jdk

      - name: Download Latest APK
        if: steps.version_check.outputs.NEW_VERSION_AVAILABLE == 'true'
        run: |
          wget -q "$DOWNLOAD_URL" -O iceraven.apk

      - name: Run Build Script
        if: steps.version_check.outputs.NEW_VERSION_AVAILABLE == 'true'
        run: bash build.sh

      - name: Sign APK
        if: steps.version_check.outputs.NEW_VERSION_AVAILABLE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -di > keystore.jks
          apksigner sign --ks keystore.jks --ks-pass pass:${{ secrets.KEYSTORE_PASSPHRASE }} --key-pass pass:${{ secrets.KEY_PASSWORD }} iceraven-patched-signed.apk

      - name: Upload APK as Artifact
        if: steps.version_check.outputs.NEW_VERSION_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iceraven-dark-apk
          path: iceraven-patched-signed.apk

      - name: Create Release
        id: create_release
        if: steps.version_check.outputs.NEW_VERSION_AVAILABLE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version_check.outputs.UPSTREAM_VERSION }}
          name: IceRaven Dark Theme ${{ steps.version_check.outputs.UPSTREAM_VERSION }}
          body: |
            Automatic release of IceRaven Dark Theme based on upstream version ${{ steps.version_check.outputs.UPSTREAM_VERSION }}.
          files: iceraven-patched-signed.apk
